<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d">
<title id="t">Manifesto: local-first, humano no circuito, tudo como código</title>
<desc id="d">Três princípios: os modelos de IA rodam localmente; a máquina propõe e Pedro aprova; servidores, pipelines e prompts ficam versionados no Git.</desc>
<style>
text{font-family:'IBM Plex Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.b{font-weight:700}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
.flow.r{animation-direction:reverse}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.roll{animation:roll 8s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.2s ease-in-out infinite alternate}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
@keyframes roll{from{transform:translateY(-90px)}to{transform:translateY(250px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="clip"><rect x="1" y="1" width="998" height="248" rx="12"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f2731" stroke-width=".6"/></pattern>
<pattern id="scan" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#000" opacity=".2"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
<linearGradient id="rollg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78dcff" stop-opacity="0"/><stop offset=".5" stop-color="#78dcff" stop-opacity=".05"/><stop offset="1" stop-color="#78dcff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="998" height="248" rx="12" fill="#03080c"/>
<g clip-path="url(#clip)">
<rect width="1000" height="250" fill="url(#grid)" opacity=".5"/>
<rect width="1000" height="34" fill="#061018"/><path d="M0 34.5H1000" stroke="#0f2731"/><circle cx="20" cy="17.0" r="3.5" fill="#ffb641" class="pulse" filter="url(#glowS)"/><text x="32" y="21.5" font-size="12.5" fill="#79b8c8">netto@kubuntu: ~/manifesto.md</text><text x="982" y="21.0" font-size="11.5" fill="#4f8d9c" text-anchor="end">3 regras para tudo o que eu construo</text>
<rect x="20" y="52" width="310" height="176" rx="6" fill="#061018" stroke="#0f2731"/>
<path d="M26 52.5H324" stroke="#b9a3ff" stroke-width="2" filter="url(#glowS)"/>
<text x="314" y="76" font-size="12" fill="#ffb641" text-anchor="end">01</text>
<rect x="50" y="84" width="40" height="40" rx="4" fill="#b9a3ff" fill-opacity=".1" stroke="#b9a3ff" stroke-width="1.5" class="pulse" filter="url(#glowS)"/>
<path d="M58 84V77M58 124V131M50 92H43M90 92H97" stroke="#b9a3ff" stroke-width="1.5"/>
<path d="M70 84V77M70 124V131M50 104H43M90 104H97" stroke="#b9a3ff" stroke-width="1.5"/>
<path d="M82 84V77M82 124V131M50 116H43M90 116H97" stroke="#b9a3ff" stroke-width="1.5"/>
<text x="70" y="108" font-size="11" class="b" fill="#b9a3ff" text-anchor="middle">LLM</text>
<text x="120" y="102" font-size="17" class="b" fill="#a9e4f2">local-first</text>
<text x="120" y="123" font-size="12" fill="#4f8d9c">inferência em casa</text>
<text x="40" y="164" font-size="13" fill="#79b8c8">Os modelos rodam na minha máquina.</text>
<text x="40" y="184" font-size="13" fill="#79b8c8">Dado sensível não vira prompt de</text>
<text x="40" y="204" font-size="13" fill="#79b8c8">terceiro.</text>
<rect x="345" y="52" width="310" height="176" rx="6" fill="#061018" stroke="#0f2731"/>
<path d="M351 52.5H649" stroke="#ffb641" stroke-width="2" filter="url(#glowS)"/>
<text x="639" y="76" font-size="12" fill="#ffb641" text-anchor="end">02</text>
<path d="M367 104H383M407 104H423" stroke="#4fd8f2" stroke-width="1.5" class="flow"/>
<circle cx="362" cy="104" r="6" fill="none" stroke="#4fd8f2" stroke-width="1.5"/>
<path d="M395 91L408 104L395 117L382 104Z" fill="#ffb641" fill-opacity=".12" stroke="#ffb641" stroke-width="1.5" filter="url(#glowS)" class="pulse"/>
<path d="M390 104l3.5 4 6.5 -8" fill="none" stroke="#ffb641" stroke-width="1.8"/>
<circle cx="428" cy="104" r="6" fill="#ffb641" filter="url(#glowS)"/>
<text x="445" y="102" font-size="17" class="b" fill="#a9e4f2">humano no circuito</text>
<text x="445" y="123" font-size="12" fill="#4f8d9c">a IA propõe, eu decido</text>
<text x="365" y="164" font-size="13" fill="#79b8c8">A máquina sugere, eu aprovo. Nada</text>
<text x="365" y="184" font-size="13" fill="#79b8c8">sai em meu nome sem um clique meu.</text>
<rect x="670" y="52" width="310" height="176" rx="6" fill="#061018" stroke="#0f2731"/>
<path d="M676 52.5H974" stroke="#6fa8ff" stroke-width="2" filter="url(#glowS)"/>
<text x="964" y="76" font-size="12" fill="#ffb641" text-anchor="end">03</text>
<path d="M708 76V132" stroke="#6fa8ff" stroke-width="1.6"/>
<path d="M708 124C708 112 734 118 734 106V100C734 90 708 94 708 84" fill="none" stroke="#4fd8f2" stroke-width="1.6"/>
<circle cx="708" cy="124" r="4" fill="#6fa8ff" class="ping" style="animation-delay:0.0s"/>
<circle cx="708" cy="124" r="4.5" fill="#03080c" stroke="#6fa8ff" stroke-width="1.6"/>
<circle cx="708" cy="104" r="4" fill="#6fa8ff" class="ping" style="animation-delay:0.6s"/>
<circle cx="708" cy="104" r="4.5" fill="#03080c" stroke="#6fa8ff" stroke-width="1.6"/>
<circle cx="734" cy="103" r="4" fill="#4fd8f2" class="ping" style="animation-delay:1.2s"/>
<circle cx="734" cy="103" r="4.5" fill="#03080c" stroke="#4fd8f2" stroke-width="1.6"/>
<circle cx="708" cy="84" r="4" fill="#6fa8ff" class="ping" style="animation-delay:1.8s"/>
<circle cx="708" cy="84" r="4.5" fill="#03080c" stroke="#6fa8ff" stroke-width="1.6"/>
<text x="770" y="102" font-size="17" class="b" fill="#a9e4f2">tudo como código</text>
<text x="770" y="123" font-size="12" fill="#4f8d9c">git é a fonte da verdade</text>
<text x="690" y="164" font-size="13" fill="#79b8c8">Servidor, pipeline e prompt</text>
<text x="690" y="184" font-size="13" fill="#79b8c8">versionados no Git: reproduzível e</text>
<text x="690" y="204" font-size="13" fill="#79b8c8">auditável.</text>

<rect width="1000" height="250" fill="url(#scan)"/>
<rect class="roll" width="1000" height="90" fill="url(#rollg)"/>
<rect width="1000" height="250" fill="url(#vig)"/>
</g>
<rect x="1" y="1" width="998" height="248" rx="12" fill="none" stroke="#1a4250"/>
</svg>
