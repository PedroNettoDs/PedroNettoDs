<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-labelledby="t d">
<title id="t">Now is better than never</title>
<desc id="d">Rodapé com o lema do Zen of Python entre duas linhas de batimento animadas.</desc>
<style>
text{font-family:'IBM Plex Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.b{font-weight:700}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
.flow.r{animation-direction:reverse}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.roll{animation:roll 8s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.2s ease-in-out infinite alternate}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
@keyframes roll{from{transform:translateY(-90px)}to{transform:translateY(120px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><style>.ecg{stroke-dasharray:70 900;animation:ecg 3.2s linear infinite}@keyframes ecg{from{stroke-dashoffset:970}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.ecg{animation:none!important;stroke-dasharray:none}}</style>
<defs>
<clipPath id="clip"><rect x="1" y="1" width="998" height="118" rx="12"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f2731" stroke-width=".6"/></pattern>
<pattern id="scan" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#000" opacity=".2"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
<linearGradient id="rollg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78dcff" stop-opacity="0"/><stop offset=".5" stop-color="#78dcff" stop-opacity=".05"/><stop offset="1" stop-color="#78dcff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="998" height="118" rx="12" fill="#03080c"/>
<g clip-path="url(#clip)">
<rect width="1000" height="120" fill="url(#grid)" opacity=".5"/>

<path d="M24 58H84H102l5 -6 5 6 4 0 4 -30 5 52 4 -28 4 6 5 0 3 -4 3 4H144H204H264H316" fill="none" stroke="#1a4250" stroke-width="1.3"/>
<path d="M24 58H84H102l5 -6 5 6 4 0 4 -30 5 52 4 -28 4 6 5 0 3 -4 3 4H144H204H264H316" fill="none" stroke="#4fd8f2" stroke-width="1.8" class="ecg" filter="url(#glowS)"/>
<path d="M684 58H744H762l5 -6 5 6 4 0 4 -30 5 52 4 -28 4 6 5 0 3 -4 3 4H804H864H924H976" fill="none" stroke="#1a4250" stroke-width="1.3"/>
<path d="M684 58H744H762l5 -6 5 6 4 0 4 -30 5 52 4 -28 4 6 5 0 3 -4 3 4H804H864H924H976" fill="none" stroke="#4fd8f2" stroke-width="1.8" class="ecg" filter="url(#glowS)"/>
<text x="500" y="56" font-size="20" class="b" fill="#a9e4f2" text-anchor="middle" filter="url(#glowS)">now is better than never.</text>
<text x="500" y="78" font-size="11.5" fill="#4f8d9c" text-anchor="middle">— the zen of python · agora é melhor que nunca</text>
<text x="500" y="106" font-size="11" fill="#4f8d9c" text-anchor="middle" opacity=".8">pedro netto · infraestrutura &amp; automação · bauru/sp · svg autoral, sem tracker</text>

<rect width="1000" height="120" fill="url(#scan)"/>
<rect class="roll" width="1000" height="90" fill="url(#rollg)"/>
<rect width="1000" height="120" fill="url(#vig)"/>
</g>
<rect x="1" y="1" width="998" height="118" rx="12" fill="none" stroke="#1a4250"/>
</svg>
